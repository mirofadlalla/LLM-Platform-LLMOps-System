[pytest]
pythonpath = .
testpaths = tests

# Run migration tests only when TEST_DATABASE_URL is available.
# Use `-m "not migration"` to skip them locally without a DB.
markers =
    migration: marks tests that require a live PostgreSQL database (deselect with -m "not migration")

filterwarnings =
    ignore::DeprecationWarning:sqlalchemy
    ignore::DeprecationWarning:alembic

name: Backend CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'alembic/**'
      - 'tasks/**'
      - 'tests/**'
      - 'Dockerfile'
      - 'requirements.txt'
      - 'alembic.ini'
      - 'docker-compose*.yml'
      - 'pytest.ini'
      - '.github/workflows/ci-cd.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - 'alembic/**'
      - 'tasks/**'
      - 'tests/**'
      - 'Dockerfile'
      - 'requirements.txt'
      - 'alembic.ini'
      - 'docker-compose*.yml'
      - 'pytest.ini'
      - '.github/workflows/ci-cd.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # ============================================================================
  # Continuous Integration (CI): Test & Validate Backend
  # ============================================================================
  ci:
    name: Backend CI (Tests & Image Build Test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run Backend Pytest Suite
        run: |
          pytest -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test Docker Build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: backend-test:latest
          cache-from: type=gha

      - name: Run Container Sanity Check
        run: |
          docker run --rm backend-test:latest python -c "
          import app.main
          import app.core.celery_app
          import app.models
          print('Backend container sanity check: PASSED')
          "

  # ============================================================================
  # Continuous Deployment (CD): Publish Production Image to GHCR
  # ============================================================================
  cd:
    name: Backend CD (Build & Push to GHCR)
    runs-on: ubuntu-latest
    needs: [ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/llmops-backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=ref,event=branch
            type=ref,event=tag

      - name: Build and push production image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Job Summary
        run: |
          echo "### :rocket: Docker Image Published to GHCR" >> $GITHUB_STEP_SUMMARY
          echo "The backend Docker image was built and published successfully after CI verification." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Published Tags:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
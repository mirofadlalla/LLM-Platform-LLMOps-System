name: Backend CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'alembic/**'
      - 'tasks/**'
      - 'tests/**'
      - 'Dockerfile'
      - 'requirements.txt'
      - 'alembic.ini'
      - 'docker-compose*.yml'
      - 'pytest.ini'
      - '.github/workflows/ci-cd.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - 'alembic/**'
      - 'tasks/**'
      - 'tests/**'
      - 'Dockerfile'
      - 'requirements.txt'
      - 'alembic.ini'
      - 'docker-compose*.yml'
      - 'pytest.ini'
      - '.github/workflows/ci-cd.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # ============================================================================
  # Job 1 – Unit & Sanity Tests (no database required)
  # ============================================================================
  unit-tests:
    name: Unit & Sanity Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run unit and sanity tests (no DB)
        run: |
          pytest -v tests/test_backend_sanity.py

  # ============================================================================
  # Job 2 – Migration Tests (requires PostgreSQL service container)
  # Runs BEFORE the Docker image is built so a broken migration cannot
  # be published to GHCR.
  # ============================================================================
  migration-tests:
    name: Alembic Migration Tests
    runs-on: ubuntu-latest

    # ------------------------------------------------------------------
    # Ephemeral PostgreSQL instance — matches the production Postgres 15
    # image used in docker-compose.yml.
    # ------------------------------------------------------------------
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: llmops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d llmops_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 10s

    env:
      # Picked up by tests/conftest.py and by alembic env.py (via Settings)
      TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/llmops_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: llmops_test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      # Dummy values — migration tests don't need Redis or external APIs
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_SECRET_KEY: ci-test-secret-not-for-production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Wait for PostgreSQL to be ready
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do
            echo "Waiting for postgres..."
            sleep 2
          done

      - name: Run static chain validation (no DB)
        run: |
          pytest -v tests/test_migrations.py::TestStaticChain \
            --tb=short \
            -p no:warnings

      - name: Run migration upgrade / downgrade / roundtrip tests
        run: |
          pytest -v tests/test_migrations.py::TestMigrationExecution \
            --tb=short \
            -p no:warnings

      - name: Upload pytest report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: migration-test-report
          path: .pytest_cache/

  # ============================================================================
  # Job 3 – Build & Sanity-Check the Docker Image
  # Only runs after BOTH unit-tests AND migration-tests pass.
  # ============================================================================
  ci:
    name: Backend CI (Docker Image Build Test)
    runs-on: ubuntu-latest
    needs: [unit-tests, migration-tests]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test Docker Build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: backend-test:latest
          cache-from: type=gha

      - name: Run Container Sanity Check
        run: |
          docker run --rm backend-test:latest python -c "
          import app.main
          import app.core.celery_app
          import app.models
          print('Backend container sanity check: PASSED')
          "

  # ============================================================================
  # Job 4 – Publish Production Image to GHCR
  # Only runs after ci job passes, on push to main or manual dispatch.
  # ============================================================================
  cd:
    name: Backend CD (Build & Push to GHCR)
    runs-on: ubuntu-latest
    needs: [ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/llmops-backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=ref,event=branch
            type=ref,event=tag

      - name: Build and push production image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Job Summary
        run: |
          echo "### :rocket: Docker Image Published to GHCR" >> $GITHUB_STEP_SUMMARY
          echo "The backend Docker image was built and published successfully after CI verification." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Published Tags:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY